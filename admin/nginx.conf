# Front door for the Kinochy deployment on a single origin:
#   /             -> the built admin SPA
#   /api, /media  -> the ASP.NET app
#   everything    -> the Next.js public site
# One origin keeps the HttpOnly admin session cookie same-site.

server {
    listen 80;
    server_name _;

    # Admin uploads stream multi-GB movie bundles through the proxy.
    client_max_body_size 0;

    # Vite filenames are content-hashed, so assets can be cached forever. The
    # HTML shell must always be revalidated or it may reference an old bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

}
