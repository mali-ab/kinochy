# Admin SPA container's own nginx (baked into the dilebar-admin image).
# It just serves the built SPA. The edge gateway (repo-root nginx.conf) mounts
# it under /admin/ and strips that prefix, so here the app lives at "/".

server {
    listen 80;
    server_name _;

    client_max_body_size 0;

    # Vite filenames are content-hashed, so assets can be cached forever. The
    # HTML shell must always be revalidated or it may reference an old bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
