# Admin SPA nginx. In the default Docker Compose stack this container is also
# the public edge, so API and media requests must be forwarded to ASP.NET.

upstream kinochy_backend {
    server app:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_socket_keepalive on;

    location /api/ {
        proxy_pass http://app:4000;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://kinochy_backend;
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # ASP.NET authorizes the request, then nginx serves the file with sendfile.
    location ^~ /_protected_media/ {
        internal;
        alias /var/lib/kinochy/movies/;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=10000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # Vite filenames are content-hashed, so assets can be cached forever. The
    # HTML shell must always be revalidated or it may reference an old bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
