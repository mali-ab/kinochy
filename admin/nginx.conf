# Admin SPA nginx. In the default Docker Compose stack this container is also
# the public edge, so API and media requests must be forwarded to ASP.NET.

server {
    listen 80;
    server_name _;

    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://app:4000;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://app:4000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Vite filenames are content-hashed, so assets can be cached forever. The
    # HTML shell must always be revalidated or it may reference an old bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
