name: kinochy



services:
  front:
      image: dilebar-front:${IMAGE_TAG:-latest}
      container_name: kinochy_front
      restart: unless-stopped
      environment:
        # Read by the standalone server.js at runtime.
        HOSTNAME: 0.0.0.0
        PORT: 5173
        NODE_ENV: production
      # Internal only: reached through the nginx gateway (location /).
      expose:
        - '5173'

  postgres:
    image: postgres:16-alpine
    container_name: kinochy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinochy}
      POSTGRES_USER: ${POSTGRES_USER:-kinochy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinochy}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  back:
    image: dilebar-back:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0}
        DOTNET_RUNTIME_IMAGE: ${DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet:10.0}
    container_name: kinochy_back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-kinochy}:${POSTGRES_PASSWORD:-kinochy}@postgres:5432/${POSTGRES_DB:-kinochy}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-https://translate.mstdn.social/translate}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      MEDIA_LIBRARY_ROOT: ${MEDIA_LIBRARY_ROOT:-/media/user/Новый том/kinochy}
    expose:
      - '4000'
    volumes:
      - app_storage:/app/storage
      - ./backend/storage/preloaded:/app/storage/preloaded:ro
      - type: bind
        source: ${MEDIA_LIBRARY_ROOT:-/media/user/Новый том/kinochy}
        target: ${MEDIA_LIBRARY_ROOT:-/media/user/Новый том/kinochy}
        read_only: true

  admin:
    image: dilebar-admin:latest
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: kinochy_admin
    restart: unless-stopped
    # Internal only: serves the SPA for the nginx gateway (location /admin/).
    expose:
      - '80'

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: kinochy_nginx
    restart: unless-stopped
    depends_on:
      - back
      - front
      - admin
    # The ONE public port of the whole stack:
    #   /        -> front   |   /admin/ -> admin   |   /api,/media -> back
    # Runs on a non-default 8080 so it never collides with the VPS nginx on
    # 80/443. Point the host nginx at this port.
    ports:
      - '${EDGE_PORT:-8080}:8080'
    volumes:
      # Edge config lives next to this compose file. Edit it, then:
      #   docker compose restart nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  app_storage: