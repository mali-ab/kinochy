# Kinochy edge gateway (mounted into the `nginx` service, plain nginx image).
# The ONE public port of the stack, on a NON-default 8080 so it never collides
# with the VPS nginx that owns 80/443. Your host nginx only reverse-proxies to
# this port; nothing here is merged into the host config. One origin keeps the
# HttpOnly admin session cookie same-site.
#
# Routing (upstreams are the compose service names on the shared network):
#   /admin/      -> the admin SPA container   (admin:80)
#   /api, /media -> the ASP.NET backend        (back:4000)
#   everything   -> the Next.js public site    (front:5173)

upstream kinochy_backend {
    server back:4000;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;

    # Admin uploads stream multi-GB movie bundles through the proxy.
    client_max_body_size 0;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Shared proxy headers ----------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_socket_keepalive on;

    # ---- API + media -> ASP.NET backend ------------------------------------
    location /api/ {
        proxy_pass http://back:4000;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://kinochy_backend;
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # ASP.NET authorizes the request, then nginx serves the file with sendfile.
    location ^~ /_protected_media/ {
        internal;
        alias /var/lib/kinochy/movies/;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=10000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # ---- Admin SPA container (served under /admin/) ------------------------
    # Redirect the bare /admin to /admin/ so the SPA shell loads.
    location = /admin {
        return 301 /admin/;
    }

    # The trailing slash on proxy_pass strips the /admin prefix, so the admin
    # container (which serves its build at its own root) sees "/...".
    location /admin/ {
        proxy_pass http://admin:80/;
        proxy_read_timeout 3600s;
    }

    # ---- Everything else -> Next.js public site ----------------------------
    location / {
        proxy_pass http://front:5173;
        # WebSocket / HMR support (Next.js).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
